name: dana-payment

services:
    # ==========================================
    # LARAVEL PHP-FPM
    # ==========================================
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile

        image: dana-payment-app:latest
        container_name: dana-payment-app

        restart: unless-stopped
        working_dir: /var/www/html

        volumes:
            - ./:/var/www/html

        extra_hosts:
            - "host.docker.internal:host-gateway"

        environment:
            TZ: Asia/Jakarta

        networks:
            - dana_network

    # ==========================================
    # NGINX WEB SERVER
    # ==========================================
    nginx:
        image: nginx:alpine
        container_name: dana-payment-nginx

        restart: unless-stopped

        ports:
            - "127.0.0.1::80"

        volumes:
            - ./:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

        depends_on:
            - app

        environment:
            TZ: Asia/Jakarta

        networks:
            - dana_network

# ==========================================
# NETWORK OTOMATIS
# ==========================================
networks:
    dana_network:
        driver: bridge
